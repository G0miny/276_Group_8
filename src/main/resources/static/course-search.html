
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search SFU Courses</title>

    <script src="/js/course-search.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 30px;
        }

        h1 {
            color: #a6192e;
        }

        .search {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
        }

        input, select, button {
            padding: 8px;
            margin: 5px;
        }

        .course-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <a href="/">Back to Home</a>

    <h1>Search SFU Courses</h1>
    <p>Find available courses and sections at SFU.</p>

    <div class="search">

        <form id="courseForm">

            <label for="year">Year</label>
            <input type="number" id="year" value="2026" required>

            <label for="term">Term</label>
            <select id="term">
                <option value="fall">Fall</option>
                <option value="spring">Spring</option>
                <option value="summer">Summer</option>
            </select>

            <label for="department">Department</label>
            <input type="text" id="department" value="CMPT" required>

            <label for="course">Course</label>
            <input type="text" id="course" value="276" required>

            <button type="submit">Search</button>

        </form>

        <p id="searchStatus"></p>
        <div id="courseResults"></div>

    </div>

</body>
</html>
