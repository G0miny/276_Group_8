
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Study Room | SFU</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f9fb;
            color: #171717;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e8e8e8;
            padding: 20px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #1967e8;
        }

        .campus-label {
            color: #777;
            font-size: 13px;
            font-weight: 600;
        }

        .hero {
            background: #ffffff;
            text-align: center;
            padding: 95px 20px 90px;
            border-bottom: 1px solid #eaeaea;
        }

        .eyebrow {
            display: inline-block;
            background: #edf3ff;
            color: #1967e8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 10px 17px;
            border-radius: 50px;
            margin-bottom: 22px;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 58px);
            font-weight: 800;
            letter-spacing: -2.5px;
            margin: 0 0 14px;
        }

        .hero-description {
            font-size: 17px;
            color: #777;
            margin-bottom: 40px;
        }

        .search-container {
            max-width: 650px;
            margin: 0 auto;
        }

        .search-container h3 {
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 12px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #e4e7ed;
            border-radius: 14px;
            padding: 7px;
            gap: 8px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.05);
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: #1967e8;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 15px 17px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }

        .search-box button {
            background: #1967e8;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 16px 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: #1052c4;
        }

        .results {
            max-width: 1050px;
            margin: 0 auto;
            padding: 60px 24px 100px;
        }

        .section-heading {
            margin-bottom: 28px;
        }

        .section-heading h2 {
            font-size: 27px;
            letter-spacing: -0.7px;
            margin: 0 0 8px;
        }

        .section-heading p {
            color: #777;
            font-size: 14px;
            margin: 0;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .room-card a {
            display: block;
            background: #ffffff;
            border: 1px solid #e9e9e9;
            border-radius: 14px;
            padding: 26px;
            text-decoration: none;
            color: inherit;
            transition: 0.2s ease;
        }

        .room-card a:hover {
            transform: translateY(-3px);
            border-color: #1967e8;
            box-shadow: 0 12px 30px rgba(0,0,0,0.07);
        }

        .room-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .room-card h3 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0 0 20px;
        }

        .view-details {
            font-size: 13px;
            font-weight: 700;
            color: #1967e8;
        }

        /* Footer */
        .footer {
            border-top: 1px solid #e8e8e8;
            padding: 28px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 22px;
            }

            .hero {
                padding: 70px 20px;
            }

            .search-box {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box button {
                width: 100%;
            }

            .results {
                padding-top: 45px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">SFU<span>Summit.</span></div>
        <div class="campus-label">SIMON FRASER UNIVERSITY</div>
    </header>

    <main>
        <section class="hero">
            <div class="eyebrow">SFU STUDY SPACE REVIEWS</div>

            <h1>Find your next<br>study spot.</h1>

            <p class="hero-description">
                Search campus rooms and discover student reviews.
            </p>

            <form th:action="@{/findRoom}" th:method="get"
                  class="search-container">

                <h3>Search Study Room by Room Number...</h3>

                <div class="search-box">
                    <input
                        type="text"
                        id="roomCode"
                        name="roomCode"
                        placeholder="Enter Room Code..."
                    />

                    <button type="submit">Find Room</button>
                </div>
            </form>
        </section>

        <section class="results">
            <div class="section-heading">
                <h2>Explore study rooms</h2>
                <p>Select a room to view its details and reviews.</p>
            </div>

            <div class="room-grid">
                <div class="room-card" th:each="room : ${rooms}">
                    <a th:href="@{'/studyroom?id=' + ${room.id}}">
                        <label class="room-label">Room Number</label>

                        <h3 th:text="${room.roomCode}"></h3>
                        <h3 th:text="${averageRating}"></h3>

                        <span class="view-details">
                            View room details &rarr;
                        </span>

                    </a>

                </div>

            </div>
        </section>
    </main>
</body>
</html>
