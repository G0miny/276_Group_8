<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Study Room | SFU</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

         .navbar {
            background: #a80028;
            color: white;
            padding: 18px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 0;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .nav-links .active {
            font-weight: bold;
            border-bottom: 2px solid white;
        }

         .hero {
            background: white;
            text-align: center;
            padding: 85px 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        .eyebrow {
            display: inline-block;
            background: #fce5eb;
            color: #a80028;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 9px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 55px);
            letter-spacing: -2px;
            margin: 0 0 15px;
        }

        .hero-description {
            font-size: 16px;
            color: #777;
            margin-bottom: 35px;
        }

        .search-container {
            max-width: 650px;
            margin: 0 auto;
        }

        .search-container h3 {
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 12px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 6px;
            gap: 8px;
        }

        .search-box:focus-within {
            border-color: #cc0633;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 15px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }

        .search-box button {
            background: #cc0633;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 15px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #a80028;
        }

        .results {
            max-width: 1000px;
            margin: 0 auto;
            padding: 55px 20px 60px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 25px;
        }

        .section-heading h2 {
            font-size: 27px;
            margin: 0 0 8px;
        }

        .section-heading p {
            color: #777;
            font-size: 14px;
            margin: 0;
        }

        .suggest-room {
            display: inline-block;
            color: #cc0633;
            background: transparent;
            border: 1px solid #cc0633;
            border-radius: 6px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .suggest-room:hover {
            background: #cc0633;
            color: white;
        }

        .room-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .room-card a {
            display: flex;
            align-items: center;
            gap: 25px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 22px;
            text-decoration: none;
            color: #222;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .room-card a:hover {
            border-color: #a80028;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .room-rating {
            flex-shrink: 0;
            width: 95px;
            text-align: center;
        }

        .rating-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 75px;
            height: 70px;
            margin: 0 auto 8px;
            border-radius: 5px;
            font-size: 30px;
            font-weight: bold;
        }

        .rating-high {
            background: #b0eacb;
            color: #15452e;
        }

        .rating-medium {
            background: #ffe7a0;
            color: #624b12;
        }

        .rating-low {
            background: #ffc2c2;
            color: #842029;
        }

        .rating-none {
            background: #ededed;
            color: #777;
            font-size: 24px;
        }

        .rating-caption {
            font-size: 11px;
            color: #777;
        }

        .room-info {
            flex: 1;
            min-width: 0;
        }

        .room-info h3 {
            font-size: 26px;
            margin: 0 0 7px;
        }

        .room-building {
            font-size: 15px;
            color: #444;
            margin: 0 0 6px;
        }

        .room-meta {
            color: #777;
            font-size: 13px;
            margin: 0 0 12px;
        }

        .view-details {
            color: #a80028;
            font-size: 13px;
            font-weight: bold;
        }

        .room-arrow {
            color: #a80028;
            font-size: 25px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .room-card a {
                padding: 16px;
                gap: 15px;
            }

            .room-rating {
                width: 70px;
            }

            .rating-box {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .room-info h3 {
                font-size: 21px;
            }

            .room-arrow {
                display: none;
            }
    }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main>
        <section class="hero">
            <div class="eyebrow">
                SFU STUDY SPACE REVIEWS
            </div>
            <h1>Find your next<br>study spot.</h1>
            <p class="hero-description">
                Search campus rooms and discover student reviews.
            </p>
            <form th:action="@{/findRoom}"
                  th:method="get"
                  class="search-container">

                <h3>Search Study Room by Room Number...</h3>
                <div class="search-box">
                    <input type="text"
                           id="roomCode"
                           name="roomCode"
                           placeholder="Enter Room Code...">

                    <button type="submit">
                        Find Room
                    </button>
                </div>
            </form>
        </section>
        <section class="results">

            <div class="section-heading">
                <div>
                    <h2>Explore study rooms</h2>
                    <p>Select a room to view its details and reviews.</p>
                </div>
        
                <a th:href="@{/room-request-form}"
                   class="suggest-room">
                    + Suggest a Room
                </a>
            </div>
            <div class="room-grid">
                <div class="room-card"
                     th:each="room : ${rooms}"
                     th:with="rating=${averageRating ?: 0}">
                    <a th:href="@{/studyroom(id=${room.id})}">
                        <div class="room-rating">
                            <div class="rating-box"
                                 th:classappend="${rating == 0 ? 'rating-none' :
                                                  (rating >= 4 ? 'rating-high' :
                                                  (rating >= 3 ? 'rating-medium' :
                                                  'rating-low'))}"
                                 th:text="${rating == 0 ? 'N/A' :
                                            #numbers.formatDecimal(rating, 1, 1)}">
                            </div>
                            <span class="rating-caption"
                                  th:text="${rating == 0 ? 'Not yet rated' : 'Overall rating'}">
                            </span>
                        </div>
                        <div class="room-info">
                            <h3 th:text="${room.roomCode}"></h3>
                            <p class="room-building"
                               th:text="${room.buildingName}">
                            </p>
                            <p class="room-meta">
                                <span th:text="${room.campus}"></span>
                                &middot;
                                <span th:text="${room.roomCategory}"></span>
                            </p>
                            <span class="view-details">
                                View ratings and reviews
                            </span>
                        </div>
                        <span class="room-arrow">&rsaquo;</span>
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
