<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFU StudySpace Reviews</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222;
        }

         .navbar {
            background: #a80028;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 0;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .nav-links .active {
            font-weight: bold;
            border-bottom: 2px solid white;
        }

         .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 25px 50px;
        }

        .breadcrumb {
            color: #777;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .breadcrumb a {
            color: #a80028;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

         .room-profile {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: start;
            gap: 50px;
            margin-bottom: 45px;
        }

        .overall-score {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .score-number {
            font-size: 85px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -5px;
            color: #222;
        }

        .score-total {
            color: #888;
            font-size: 28px;
            font-weight: bold;
        }

        .rating-count {
            color: #666;
            font-size: 14px;
            margin: 15px 0 25px;
        }

        .room-title {
            font-size: 42px;
            letter-spacing: -1.5px;
            margin: 0 0 10px;
        }

        .building-name {
            font-size: 17px;
            color: #444;
            margin: 0 0 8px;
        }

        .campus-name {
            font-size: 14px;
            color: #777;
            margin: 0 0 25px;
        }

        .review-button {
            display: inline-block;
            background: #a80028;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }

        .review-button:hover {
            background: #850020;
        }

        /* Rating Breakdown */
        .breakdown {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 30px;
        }

        .breakdown h2 {
            font-size: 20px;
            margin: 0 0 30px;
        }

        .rating-row {
            margin-bottom: 25px;
        }

        .rating-row:last-child {
            margin-bottom: 0;
        }

        .rating-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .rating-label {
            font-size: 14px;
            font-weight: bold;
        }

        .rating-value {
            font-size: 14px;
            font-weight: bold;
        }

        .bar {
            height: 13px;
            background: #dedede;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #a80028;
            border-radius: 4px;
        }

         .reviews-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #ddd;
            padding-top: 25px;
            margin-bottom: 25px;
        }

        .reviews-header h2 {
            font-size: 24px;
            margin: 0;
        }

        .reviews-subtitle {
            font-size: 13px;
            color: #777;
        }

         .review-card {
            display: flex;
            gap: 30px;
            background: #f5f5f5;
            padding: 25px;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .review-rating {
            width: 95px;
            flex-shrink: 0;
            text-align: center;
        }

        .review-rating-label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .review-score {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 75px;
            height: 75px;
            margin: 0 auto;
            font-size: 32px;
            font-weight: 800;
            border-radius: 4px;
        }

         .score-high {
            background: #b0eacb;
            color: #15452e;
        }

        .score-medium {
            background: #ffe7a0;
            color: #624b12;
        }

        .score-low {
            background: #ffc2c2;
            color: #842029;
        }

        .review-content {
            flex: 1;
            min-width: 0;
        }

        .review-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .review-top h3 {
            margin: 0;
            font-size: 16px;
        }

        .review-date {
            color: #666;
            font-size: 13px;
            margin: 0;
        }

        .review-comment {
            font-size: 15px;
            line-height: 1.7;
            margin: 0;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .empty-reviews {
            text-align: center;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 35px 20px;
        }

        .empty-reviews h3 {
            font-size: 20px;
            margin: 0 0 10px;
        }

        .empty-reviews p {
            font-size: 14px;
            color: #777;
            margin: 0 0 20px;
        }

        .empty-review-link {
            color: #a80028;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }

        .empty-review-link:hover {
            text-decoration: underline;
        }
        .error {
            background: #ffe6eb;
            color: #a80028;
            border: 1px solid #f2b8c4;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        @media (max-width: 650px) {

            .navbar {
                flex-direction: column;
                padding: 18px;
            }

            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                margin: 25px auto;
                padding: 0 20px 40px;
            }

            .room-profile {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .score-number {
                font-size: 65px;
            }

            .room-title {
                font-size: 34px;
            }

            .breakdown {
                padding: 22px;
            }

            .review-card {
                padding: 18px;
                gap: 15px;
            }

            .review-rating {
                width: 65px;
            }

            .review-score {
                width: 60px;
                height: 60px;
                font-size: 26px;
            }

            .reviews-header {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container" th:with="reviewCount=${reviews == null ? 0 : #lists.size(reviews)}">
        <div class="breadcrumb">
            Study Spaces /
            <span th:text="${room.roomCode}"></span>
        </div>
        <p class="error"
           th:if="${roomError}"
           th:text="${roomError}">
        </p>
        <p class="error"
           th:if="${userError}"
           th:text="${userError}">
        </p>
        <section class="room-profile">
            <div class="room-information">
                <div class="overall-score">
                    <span class="score-number"
                          th:text="${reviewCount == 0 ? 'N/A' : #numbers.formatDecimal(average, 1, 1)}">
                    </span>

                    <span class="score-total"
                          th:if="${reviewCount > 0}">
                        / 5
                    </span>

                </div>

                <p class="rating-count"
                   th:text="|Overall rating based on ${reviewCount} ${reviewCount == 1 ? 'review' : 'reviews'}|">
                </p>

                <h1 class="room-title"
                    th:text="${room.roomCode}">
                </h1>

                <p class="building-name"
                   th:text="${room.buildingName}">
                </p>

                <p class="campus-name">
                    Simon Fraser University &middot;
                    <span th:text="${room.campus}"></span>
                </p>
                <a class="review-button"
                   th:href="@{/write-review(id=${room.id})}">
                    Rate this room
                </a>
            </div>
            <div class="breakdown">
                <h2>Rating Breakdown</h2>
                <div class="rating-row">
                    <div class="rating-heading">
                        <span class="rating-label">
                            Amenities
                        </span>
                        <span class="rating-value"
                              th:text="${reviewCount == 0 ? 'N/A' : #numbers.formatDecimal(amentites, 1, 1) + '/5'}">
                        </span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill"
                             th:style="|width: ${reviewCount == 0 ? 0 : amentites * 20}%;|">
                        </div>
                    </div>
                </div>
                <div class="rating-row">
                    <div class="rating-heading">
                        <span class="rating-label">
                            Noise
                        </span>
                        <span class="rating-value"
                              th:text="${reviewCount == 0 ? 'N/A' : #numbers.formatDecimal(noise, 1, 1) + '/5'}">
                        </span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill"
                             th:style="|width: ${reviewCount == 0 ? 0 : noise * 20}%;|">
                        </div>
                    </div>
                </div>
                <div class="rating-row">
                    <div class="rating-heading">
                        <span class="rating-label">
                            Cleanliness
                        </span>
                        <span class="rating-value"
                              th:text="${reviewCount == 0 ? 'N/A' : #numbers.formatDecimal(cleanliness, 1, 1) + '/5'}">
                        </span>
                    </div>
                    <div class="bar">
                        <div class="bar-fill"
                             th:style="|width: ${reviewCount == 0 ? 0 : cleanliness * 20}%;|">
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="reviews">
            <div class="reviews-header">
                <h2 th:text="|${reviewCount} Student ${reviewCount == 1 ? 'Rating' : 'Ratings'}|">
                </h2>
                <span class="reviews-subtitle">
                    Room reviews
                </span>
            </div>
            <div class="empty-reviews"
                 th:if="${reviewCount == 0}">
                <h3>No ratings yet</h3>
                <p>
                    Be the first to share your experience
                    studying in this room.
                </p>
                <a class="empty-review-link"
                   th:href="@{/write-review(id=${room.id})}">
                    Write the first review &rarr;
                </a>
            </div>
            <article class="review-card"
                     th:each="review : ${reviews}">

                <div class="review-rating">
                    <span class="review-rating-label">
                        OVERALL
                    </span>
                    <div class="review-score"
                         th:classappend="${(review.averageRating ?: 0) >= 4 ? 'score-high' : ((review.averageRating ?: 0) >= 3 ? 'score-medium' : 'score-low')}"
                         th:text="${#numbers.formatDecimal(review.averageRating ?: 0, 1, 1)}">
                    </div>
                </div>
                <div class="review-content">
                    <div class="review-top">
                        <h3 th:text="${review.user.username}">
                        </h3>
                        <p class="review-date"
                           th:text="${review.daysSinceReview} + ' days ago'">
                        </p>
                    </div>
                    <p class="review-comment"
                       th:text="${review.comment}">
                    </p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
