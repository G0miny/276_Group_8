<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Summit SFU - Room Requests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h2 class="fw-bold mb-4">Room Requests</h2>
    <div th:if="${#lists.isEmpty(requests)}"
     class="text-center bg-white rounded shadow-sm p-5 mt-4">
    <div class="display-4 text-success mb-3">&#10003;</div>
        <h4 class="fw-bold">No Room Requests</h4>
        <p class="text-muted mb-4">
            You're all caught up! There are no room requests to display.
        </p>
        <a th:href="@{/admin/room-request}"
        class="btn btn-outline-secondary me-2">
            View All Requests
        </a>
        <a th:href="@{/dashboard}"
        class="btn btn-danger">
            Back to Dashboard
        </a>
    </div>
    <div class="alert alert-danger"
     th:if="${error}"
     th:text="${error}">
    </div>
    <div class="alert alert-success"
        th:if="${success}"
        th:text="${success}">
    </div>

    <div class="row g-4">
        <div class="col-md-6"
            th:each="request : ${requests}">
    
            <div class="card shadow-sm border-0 h-100">
                <div th:each="image : ${request.imageUrl}">
                    <img th:src="${image}"
                        class="card-img-top"
                        style="height: 250px; object-fit: cover;"
                        alt="Submitted room image">
                </div>
    
                <div th:if="${#lists.isEmpty(request.imageUrl)}"
                    class="bg-light text-muted text-center p-5">
                    No image submitted
                </div>
    
                <div class="card-body">
    
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold"
                            th:text="${request.roomCode}">
                        </h4>
    
                        <span class="badge"
                            th:classappend="${request.status.name() == 'PENDING'} ? 'bg-warning text-dark' : (${request.status.name() == 'APPROVED'} ? 'bg-success' : 'bg-danger')"
                            th:text="${request.status}">
                        </span>
                    </div>
    
                    <p>
                        <strong>Building:</strong>
                        <span th:text="${request.buildingName}"></span>
                    </p>
                    <p>
                        <strong>Campus:</strong>
                        <span th:text="${request.campus}"></span>
                    </p>
                    <p>
                        <strong>Submitted By:</strong>
                        <span th:text="${request.user.username}"></span>
                    </p>
                    <p>
                        <strong>Request ID:</strong>
                        <span th:text="${request.id}"></span>
                    </p>
                    <hr>
                    <div 
                        class="alert alert-warning"
                        th:if="${request.status.name() == 'PENDING' and existingRooms[request.id]}">
                        This room already exists in the directory.
                    </div>
                    <div class="d-flex gap-2" th:if="${request.status.name() == 'PENDING'}">
                        <form th:action="@{/admin/room-request/{id}/approve(id=${request.id})}" method="post" class="flex-fill">
                            <button 
                                type="submit" 
                                th:disabled="${existingRooms[request.id]}"
                                class="btn btn-success w-100">
                                Approve Room
                            </button>
                        </form>
                        <form th:action="@{/admin/room-request/{id}/reject(id=${request.id})}" method="post" class="flex-fill">
                            <button type="submit" class="btn btn-outline-danger w-100">
                                Reject Request
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
