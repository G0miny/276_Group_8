<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Study Room | SFU StudySpace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container py-5" style="max-width: 650px;">
        <div class="bg-white border rounded-3 shadow-sm p-4">

            <h2 class="fw-bold mb-2">Suggest a Study Room</h2>
            <p class="text-muted mb-4">
                Submit a room for an administrator to review.
            </p>

            <div class="alert alert-danger"
                 th:if="${userError}"
                 th:text="${userError}">
            </div>

            <form th:action="@{/request}"
                  th:object="${roomRequest}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Room Code</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{roomCode}"
                           placeholder="e.g. AQ3005"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Building Name</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{buildingName}"
                           placeholder="e.g. Academic Quadrangle"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Campus</label>
                    <select class="form-select"
                            th:field="*{campus}"
                            required>

                        <option value="">Select a campus</option>
                        <option value="Burnaby">Burnaby</option>
                        <option value="Surrey">Surrey</option>
                        <option value="Vancouver">Vancouver</option>

                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Room Image
                        <span class="text-muted fw-normal">(Optional)</span>
                    </label>

                    <input type="file"
                           class="form-control"
                           th:field="*{image}"
                           accept="image/jpeg,image/png">

                    <small class="text-muted">
                        Supported formats: JPG and PNG.
                    </small>
                </div>

                <button type="submit"
                        class="btn text-white w-100 py-2"
                        style="background-color: #cc0033;">
                    Submit Request
                </button>

            </form>
        </div>
    </main>
</body>
</html>
