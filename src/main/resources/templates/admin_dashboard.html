<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Summit SFU - Admin dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card shadow-sm border-0 p-4 mb-4">
        <h2 class="fw-bold mb-1">Admin Control Panel</h2>
        <p class="text-muted mb-0">
            Logged in as <strong th:text="${user.username}">admin</strong>
            (<span th:text="${user.email}">admin@example.com</span>)
        </p>
    </div>

    <div class="card shadow-sm border-0 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">All Registered Users in Database</h5>
            <span class="badge bg-dark" th:text="${#lists.size(users) + ' Total Users'}"></span>
        </div>
        <div class="dropdown">
            <button class="btn btn-outline-danger dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
        
                Room Requests
                <span id="requestCount"
                      class="badge rounded-pill bg-danger"
                      th:text="${pendingRequestCount}">0</span>
            </button>
        
            <ul class="dropdown-menu dropdown-menu-end">
        
                <li>
                    <h6 class="dropdown-header">Pending Room Requests</h6>
                </li>
                <li th:each="request : ${pendingRequests}">
                    <a class="dropdown-item"
                       th:href="@{/admin/room-request/{id}(id=${request.id})}">
                
                        <strong th:text="${request.roomCode}"></strong>
                        <small th:text="${request.campus}"></small>
                
                    </a>
                </li>
                <li th:if="${#lists.isEmpty(pendingRequests)}">
                    <span class="dropdown-item-text text-muted">
                        No pending requests
                    </span>
                </li>
        
                <li><hr class="dropdown-divider"></li>
        
                <li>
                    <a class="dropdown-item text-danger"
                       th:href="@{/admin/room-request}">
                        View All Requests
                    </a>
                </li>
        
            </ul>
        </div>
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>UID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th class="text-end">Admin Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.uid}">1</td>
                    <td class="fw-semibold" th:text="${u.username}">username</td>
                    <td th:text="${u.email}">email@example.com</td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                              th:text="${u.role}">USER</span>
                    </td>
                    <td class="text-end">
                        <div th:if="${u.uid != user.uid}" class="d-inline-flex gap-2">
                            <form th:action="@{/admin/users/{id}/toggle-role(id=${u.uid})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-dark"
                                        th:text="${u.role.name() == 'ADMIN'} ? 'Demote to User' : 'Make Admin'">
                                </button>
                            </form>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.uid})}" method="post"
                                  onsubmit="return confirm('Delete this user?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                        <span th:if="${u.uid == user.uid}" class="text-muted small fst-italic">Current Admin</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script>
    async function updateRequestCount() {
        const response = await fetch("/admin/room-request/count");

        if (response.ok) {
            const count = await response.json();
            document.getElementById("requestCount").textContent = count;
        }
    }

    setInterval(updateRequestCount, 5000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
