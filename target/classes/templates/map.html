<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFU Room Map & Pathfinder</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #app-layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        #sidebar {
            width: 380px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.08);
        }
        .sidebar-header {
            background-color: #CC0633;
            color: #ffffff;
            padding: 18px 20px;
        }
        .sidebar-header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
        .sidebar-header p { margin: 4px 0 0 0; font-size: 0.85rem; opacity: 0.9; }
        .sidebar-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .section-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #555555;
            margin-top: 15px;
            margin-bottom: 10px;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 5px;
        }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #333333; }
        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #CC0633;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #CC0633;
            color: #ffffff;
            margin-top: 5px;
        }
        .btn-primary:hover { background-color: #a00528; }
        .btn-secondary {
            background-color: #f1f1f1;
            color: #444444;
            border: 1px solid #dddddd;
            margin-top: 8px;
        }
        .btn-secondary:hover { background-color: #e4e4e4; }
        .route-card {
            background: #fafafa;
            border-left: 4px solid #CC0633;
            border-radius: 0 4px 4px 0;
            padding: 12px 16px;
            margin-top: 15px;
            display: none;
        }
        .route-card p { margin: 6px 0; font-size: 0.9rem; color: #333; }
        .route-card span { font-weight: 700; color: #CC0633; }
        #map { flex: 1; height: 100%; }
        .room-count-badge {
            font-size: 0.8rem;
            color: #666666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div id="app-layout">
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>SFU Room Map Pathfinder</h1>
            <p>Simon Fraser University Campus Navigation</p>
        </div>
        <div class="sidebar-content">
            <div class="section-title">Filter & Search</div>
            
            <div class="form-group">
                <label for="campusFilter">Campus</label>
                <select id="campusFilter">
                    <option value="ALL">All Campuses</option>
                    <option value="BURNABY" selected>Burnaby</option>
                    <option value="SURREY">Surrey</option>
                    <option value="VANCOUVER">Vancouver</option>
                </select>
            </div>

            <div class="form-group">
                <label for="buildingFilter">Building</label>
                <select id="buildingFilter">
                    <option value="ALL">All Buildings</option>
                </select>
            </div>

            <div class="form-group">
                <label for="roomSearch">Search Room / Code</label>
                <input type="text" id="roomSearch" placeholder="e.g. AQ 3150, CSIL, WMC..." />
                <div id="roomCount" class="room-count-badge">Loading campus rooms...</div>
            </div>

            <div class="section-title">Pathfinder & Route</div>

            <div class="form-group">
                <label for="startRoomSelect">Start Location (Room)</label>
                <select id="startRoomSelect">
                    <option value="">Select origin room...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="destRoomSelect">Destination Location (Room)</label>
                <select id="destRoomSelect">
                    <option value="">Select destination room...</option>
                </select>
            </div>

            <button id="btnCalculateRoute" class="btn btn-primary">Find Walking Route</button>
            <button id="btnClearRoute" class="btn btn-secondary">Clear Route</button>

            <div id="routeDetails" class="route-card">
                <p><strong>Distance:</strong> <span id="routeDistance">0</span> meters</p>
                <p><strong>Est. Walking Time:</strong> <span id="routeTime">0</span> minutes</p>
                <p style="font-size: 0.8rem; color: #777;">*Calculated using campus walking pace (~80 m/min).</p>
            </div>
        </div>
    </div>
    <div id="map"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize map centered at SFU Burnaby Campus
    const burnabyCoords = [49.2781, -122.9199];
    const map = L.map('map').setView(burnabyCoords, 16);

    // Add OpenStreetMap base tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors | Simon Fraser University'
    }).addTo(map);

    let allRooms = [];
    let displayedRooms = [];
    let markerLayerGroup = L.layerGroup().addTo(map);
    let routePolyline = null;

    // Fetch rooms from backend endpoint
    fetch('/api/rooms/data')
        .then(response => {
            if (!response.ok) throw new Error('Network error fetching room dataset');
            return response.json();
        })
        .then(data => {
            // Keep rooms with valid coordinates
            allRooms = data.filter(r => r.latitude != null && r.longitude != null);
            populateBuildingDropdown(allRooms);
            filterAndRenderRooms();
        })
        .catch(err => {
            console.error('Failed to load room coordinates:', err);
            document.getElementById('roomCount').innerText = 'Error loading room data.';
        });

    function populateBuildingDropdown(rooms) {
        const buildingSelect = document.getElementById('buildingFilter');
        const buildings = new Map();

        rooms.forEach(r => {
            if (r.buildCode && !buildings.has(r.buildCode)) {
                buildings.set(r.buildCode, r.buildingName || r.buildCode);
            }
        });

        Array.from(buildings.entries())
            .sort((a, b) => a[0].localeCompare(b[0]))
            .forEach(([code, name]) => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = `${code} - ${name}`;
                buildingSelect.appendChild(opt);
            });
    }

    function populateSelectOptions(rooms) {
        const startSelect = document.getElementById('startRoomSelect');
        const destSelect = document.getElementById('destRoomSelect');

        const curStart = startSelect.value;
        const curDest = destSelect.value;

        startSelect.innerHTML = '<option value="">Select origin room...</option>';
        destSelect.innerHTML = '<option value="">Select destination room...</option>';

        const sorted = [...rooms].sort((a, b) => (a.roomCode || '').localeCompare(b.roomCode || ''));

        sorted.forEach(room => {
            const label = `${room.roomCode || room.roomNumber} (${room.buildCode || 'N/A'}) - Fl: ${room.floor || 'N/A'}`;
            const opt1 = new Option(label, room.roomCode);
            const opt2 = new Option(label, room.roomCode);
            startSelect.add(opt1);
            destSelect.add(opt2);
        });

        if (curStart) startSelect.value = curStart;
        if (curDest) destSelect.value = curDest;
    }

    function renderMarkers(rooms) {
        markerLayerGroup.clearLayers();

        rooms.forEach(room => {
            const marker = L.circleMarker([room.latitude, room.longitude], {
                radius: 6,
                fillColor: '#CC0633',
                color: '#ffffff',
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.85
            });

            const popupContent = `
                <div style="font-size: 13px; line-height: 1.4;">
                    <strong style="color: #CC0633; font-size: 14px;">${room.roomCode || room.roomNumber}</strong><br/>
                    <b>Building:</b> ${room.buildingName || 'N/A'} (${room.buildCode || 'N/A'})<br/>
                    <b>Floor:</b> ${room.floor || 'N/A'}<br/>
                    <b>Campus:</b> ${room.campus || 'N/A'}<br/>
                    <b>Category:</b> ${room.roomCategory || 'N/A'}<br/>
                    <div style="margin-top: 8px; display: flex; gap: 6px;">
                        <button onclick="selectAsStart('${room.roomCode}')" style="background:#CC0633; color:#fff; border:none; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:11px;">Set as Start</button>
                        <button onclick="selectAsDest('${room.roomCode}')" style="background:#444; color:#fff; border:none; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:11px;">Set as Dest</button>
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent);
            markerLayerGroup.addLayer(marker);
        });

        document.getElementById('roomCount').innerText = `Showing ${rooms.length} mapped rooms`;
    }

    function filterAndRenderRooms() {
        const campusVal = document.getElementById('campusFilter').value;
        const buildingVal = document.getElementById('buildingFilter').value;
        const searchVal = document.getElementById('roomSearch').value.toLowerCase().trim();

        displayedRooms = allRooms.filter(room => {
            const matchesCampus = (campusVal === 'ALL') || (room.campus && room.campus.toUpperCase() === campusVal);
            const matchesBuilding = (buildingVal === 'ALL') || (room.buildCode && room.buildCode.toUpperCase() === buildingVal);
            const matchesSearch = !searchVal ||
                (room.roomCode && room.roomCode.toLowerCase().includes(searchVal)) ||
                (room.roomNumber && room.roomNumber.toLowerCase().includes(searchVal)) ||
                (room.buildingName && room.buildingName.toLowerCase().includes(searchVal)) ||
                (room.buildCode && room.buildCode.toLowerCase().includes(searchVal));

            return matchesCampus && matchesBuilding && matchesSearch;
        });

        renderMarkers(displayedRooms);
        populateSelectOptions(displayedRooms);
    }

    window.selectAsStart = function(roomCode) {
        document.getElementById('startRoomSelect').value = roomCode;
    };

    window.selectAsDest = function(roomCode) {
        document.getElementById('destRoomSelect').value = roomCode;
    };

    // Event listeners for filters
    document.getElementById('campusFilter').addEventListener('change', filterAndRenderRooms);
    document.getElementById('buildingFilter').addEventListener('change', filterAndRenderRooms);
    document.getElementById('roomSearch').addEventListener('input', filterAndRenderRooms);

    // Route calculation logic
    document.getElementById('btnCalculateRoute').addEventListener('click', function() {
        const startCode = document.getElementById('startRoomSelect').value;
        const destCode = document.getElementById('destRoomSelect').value;

        if (!startCode || !destCode) {
            alert('Please select both an origin and destination room.');
            return;
        }

        const startRoom = allRooms.find(r => r.roomCode === startCode);
        const destRoom = allRooms.find(r => r.roomCode === destCode);

        if (!startRoom || !destRoom) {
            alert('Selected room coordinates could not be found.');
            return;
        }

        if (routePolyline) {
            map.removeLayer(routePolyline);
        }

        const startPoint = L.latLng(startRoom.latitude, startRoom.longitude);
        const destPoint = L.latLng(destRoom.latitude, destRoom.longitude);

        // Draw path polyline
        routePolyline = L.polyline([startPoint, destPoint], {
            color: '#CC0633',
            weight: 5,
            opacity: 0.85,
            dashArray: '8, 8'
        }).addTo(map);

        map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

        // Calculate direct distance
        const distanceMeters = Math.round(startPoint.distanceTo(destPoint));
        const estimatedMinutes = (distanceMeters / 80).toFixed(1);

        document.getElementById('routeDistance').innerText = distanceMeters;
        document.getElementById('routeTime').innerText = estimatedMinutes;
        document.getElementById('routeDetails').style.display = 'block';
    });

    document.getElementById('btnClearRoute').addEventListener('click', function() {
        if (routePolyline) {
            map.removeLayer(routePolyline);
            routePolyline = null;
        }
        document.getElementById('routeDetails').style.display = 'none';
        map.setView(burnabyCoords, 16);
    });
</script>
</body>
</html>
